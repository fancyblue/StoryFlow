name: Validate static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Cache-query checking compares this branch against its base, so the
          # shallow default checkout is not enough.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-static.mjs
      # The browser suite cannot see colour: it compares screenshots through pixelmatch,
      # whose default threshold ignores a hue change that keeps the same lightness. This
      # is the only job that checks the palette, so it runs on every push and PR.
      - run: node scripts/palette-contract.mjs
      # A rule nothing can match, or a declaration the same selector overrides later, is
      # how the override layers grew. Both are provable from the text, so both fail here.
      - run: node scripts/dead-selectors.mjs --check
      - run: node scripts/dead-declarations.mjs --check
      # GitHub Pages serves these files directly, so a changed asset that keeps its
      # old ?v= query reaches returning browsers as the previous version.
      - name: Cache queries match changed assets
        if: github.event_name == 'pull_request'
        run: node scripts/bump-assets.mjs --check --base "origin/${{ github.base_ref }}"

  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static-validation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
